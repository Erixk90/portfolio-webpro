# Netlify — sitio WebPro (Astro SSG)

[build]
  command = "pnpm --filter webpro-portfolio-storefront build"
  publish = "apps/storefront/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

[context.production.environment]
  # Descomentá si usás CMS. El build lee el CMS en build time; si está caído,
  # usa site.js y no se rompe.
  # WEBPRO_CMS_URL = "https://<tu-cms>"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
